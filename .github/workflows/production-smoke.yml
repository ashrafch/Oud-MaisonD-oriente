name: Production smoke monitoring
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify storefront and access control
        run: |
          for attempt in $(seq 1 12); do
            if node scripts/smoke-production.mjs; then exit 0; fi
            sleep 15
          done
          exit 1
